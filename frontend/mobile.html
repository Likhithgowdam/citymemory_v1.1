<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18232E">
<title>City Memory</title>
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
:root{
  --paper:#F3F6F7;--ink:#18232E;--ink2:#3A4A57;--muted:#5B6B78;--rule:#D3DCE1;--soft:#E3E9EC;
  --rain:#2F6F9F;--rainW:#E2EDF5;--fail:#C2412D;--failW:#F8E6E2;--kerb:#F2C200;--kerbW:#FDF3C4;
  --amber:#B7791F;--amberW:#FBEFD2;--fixed:#2E7D5B;--fixedW:#E3F1EA;--greyW:#E9EEF1;
  --shadow:0 2px 12px rgba(24,35,46,.07);
  --body:"Public Sans","Noto Sans Kannada","Noto Sans Devanagari",system-ui,sans-serif;
  --disp:"Barlow Semi Condensed","Noto Sans Kannada","Noto Sans Devanagari",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--body)}
button,input,textarea{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper)}
#screen{flex:1;display:flex;flex-direction:column;gap:14px;padding:18px 20px 24px}
#tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--soft);padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:500}
#tabs[hidden]{display:none}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);text-decoration:none;font:500 12px/1.2 var(--body);text-align:center}
#tabs a.on{color:var(--ink);font-weight:700}
h1,.h1{font:700 30px/1.08 var(--disp);margin:0;letter-spacing:-.2px}
.h2{font:700 18px/1.25 var(--body);margin:0}
.h3{font:700 15px/1.3 var(--body);margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px;line-height:1.4} .ink2{color:var(--ink2)}
.row{display:flex;align-items:center;gap:12px} .row.top{align-items:flex-start} .between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:4px;min-width:0} .grow{flex:1} .stack{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid var(--soft);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:9px}
a.card,a.plain{color:inherit;text-decoration:none}
.link{color:var(--rain);font-weight:600;text-decoration:none;font-size:14px;background:none;border:0;padding:0;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:14px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:600 17px/1.2 var(--body);cursor:pointer;text-decoration:none;text-align:center}
.btn.light{background:#fff;color:var(--ink);border-color:var(--rule)}
.btn.good{background:var(--fixedW);color:var(--fixed);border:1.5px solid var(--fixed)}
.btn.warn{background:#fff;color:var(--fail);border-color:var(--fail)}
.btn.small{width:auto;padding:10px 14px;font-size:14px;border-radius:10px;align-self:flex-start}
.btn:disabled{opacity:.45;cursor:default}
.badge{display:inline-flex;align-self:flex-start;align-items:center;padding:3px 8px;border-radius:6px;font:600 12px/1.3 var(--body);white-space:nowrap}
.b-red{background:var(--failW);color:var(--fail)} .b-amber{background:var(--amberW);color:var(--amber)}
.b-blue{background:var(--rainW);color:var(--rain)} .b-green{background:var(--fixedW);color:var(--fixed)} .b-grey{background:var(--greyW);color:var(--ink2)}
.bub{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%}
.prog{display:flex;gap:4px} .prog i{flex:1;height:6px;border-radius:3px;background:var(--soft)} .prog i.on{background:var(--fixed)}
.kerb{height:8px;border-radius:4px;background:repeating-linear-gradient(-45deg,var(--kerb) 0 6px,var(--ink) 6px 12px)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font:600 16px var(--body);align-self:flex-start;background:none;border:0;padding:2px 0;cursor:pointer}
.stepbar{display:flex;align-items:center;gap:12px}
.stepbar .prog{flex:1}
/* language + role */
.intro{flex:1;display:flex;flex-direction:column;gap:14px}
.logo{width:56px;height:56px}
.choice{display:flex;align-items:center;gap:12px;width:100%;padding:16px 18px;border-radius:16px;background:#fff;border:1px solid var(--soft);box-shadow:var(--shadow);cursor:pointer;text-align:left}
.choice .big{font:600 20px/1.2 var(--body)}
.choice .tk{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center}
.choice.on{border:2px solid var(--ink);padding:15px 17px}
.choice.on .tk{background:var(--ink);border-color:var(--ink)}
/* home */
.hero{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:18px;background:var(--ink);color:#fff;text-decoration:none;box-shadow:0 6px 18px rgba(24,35,46,.18)}
.hero .bub{background:var(--kerb)}
.hero h2{font:700 24px/1.1 var(--disp);margin:0}
.tip{background:var(--kerbW);border:1px solid #F3E2A0;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
/* pick */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:#fff;border:1px solid var(--soft);box-shadow:var(--shadow);text-align:left;cursor:pointer;min-height:136px}
.tile .tk{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--ink);display:none;place-items:center}
.tile.on{border:2px solid var(--ink);padding:13px}
.tile.on .tk{display:grid}
.tile b{font:700 16px/1.2 var(--body)}
/* details */
.photo-pick{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:120px;border-radius:16px;border:1.5px dashed #9FB2BE;background:#F7F9FA;cursor:pointer;overflow:hidden;text-align:center;padding:12px}
.photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-pick .over{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(24,35,46,.78);color:#fff;border-radius:8px;padding:6px 8px;font-size:13px}
.voice{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--soft);box-shadow:var(--shadow);cursor:pointer;width:100%;text-align:left}
.voice .bub{background:var(--ink)}
.voice.live .bub{background:var(--fail);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.seg{display:flex;background:#E6ECEF;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font:500 14px var(--body);color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
textarea,input[type=text],input[type=number],input[type=password]{width:100%;border:1px solid #AFC0CA;background:#FBFCFD;border-radius:12px;padding:12px 14px;font:400 16px/1.4 var(--body)}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--rain);outline-offset:0;border-color:var(--rain)}
.label{font:700 15px var(--body)}
.chipbtn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--soft);width:100%;text-align:left;cursor:pointer}
/* result */
.big-ok{width:64px;height:64px;border-radius:50%;background:var(--fixedW);display:grid;place-items:center}
.steps{display:flex;flex-direction:column;gap:0}
.steps .st{display:flex;gap:12px;position:relative;padding-bottom:14px}
.steps .st:last-child{padding-bottom:0}
.steps .st::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--soft)}
.steps .st:last-child::before{display:none}
.steps .dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--rule);background:#fff;display:grid;place-items:center;z-index:1}
.steps .st.done .dot{background:var(--fixed);border-color:var(--fixed)}
.steps .st.now .dot{border-color:var(--ink);box-shadow:0 0 0 4px rgba(24,35,46,.08)}
/* maps */
.minimap{height:190px;border-radius:16px;overflow:hidden;border:1px solid var(--soft);background:#E4EAEC}
.bigmap{height:calc(100dvh - 210px);min-height:360px;border-radius:16px;overflow:hidden;border:1px solid var(--soft);background:#E4EAEC}
.leaflet-container{font:inherit;background:#E4EAEC}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* engineer */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--soft);border-radius:14px;box-shadow:var(--shadow);padding:12px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px}
.stat b{font:700 28px/1 var(--disp)}
.stat span{font-size:12.5px;line-height:1.3;color:var(--ink2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:#fff;border:1px solid var(--soft);border-radius:14px;padding:12px}
.fact b{display:block;font:700 24px/1.05 var(--disp)}
.fact span{font-size:12.5px;color:var(--muted)}
.vrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--soft);text-decoration:none;color:inherit}
.vrow:last-child{border-bottom:0}
.rank{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 14px var(--body)}
.alertcard{background:var(--failW);border:1px solid #EDC9C1;border-radius:16px;padding:14px 16px;display:flex;gap:12px;text-decoration:none;color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:var(--greyW);font:600 12px var(--body);color:var(--ink2);border:0}
button.chip{cursor:pointer}
.ai{border-left:4px solid var(--rain)}
.hist{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft)}
.hist:last-child{border-bottom:0}
.hist .mk{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px}
.thumbs{display:flex;gap:8px}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--soft)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:#fff;border:1px solid var(--soft);box-shadow:var(--shadow);text-align:left;cursor:pointer}
.opt.on{border:2px solid var(--ink);padding:13px}
.money{display:flex;align-items:center;border:1px solid #AFC0CA;background:#FBFCFD;border-radius:12px;padding:0 14px}
.money span{font:600 17px var(--body)}
.money input{border:0;background:none;outline:0;padding:13px 8px;font:600 17px var(--body)}
.photos2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos2 .photo-pick{min-height:104px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair figure{margin:0;display:flex;flex-direction:column;gap:6px}
.pair .ph{height:120px;border-radius:12px;background:#C9D3DA center/cover no-repeat;display:grid;place-items:center;color:var(--ink2);font-size:13px}
/* misc */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:420px;width:calc(100% - 40px);background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.spin{margin:40px auto;width:34px;height:34px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--ink);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:1500;background:var(--paper);display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.sheet[hidden]{display:none}
.sheet-top{display:flex;gap:12px;align-items:flex-start;padding:16px 20px 12px}
.sheet-map{position:relative;flex:1}
.sheet-map #pick-map{position:absolute;inset:0}
.sheet-map .pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:600;pointer-events:none}
.sheet-bot{display:flex;flex-direction:column;gap:10px;padding:12px 20px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--soft)}
.iconbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:#fff;display:grid;place-items:center;cursor:pointer}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 button{padding:10px 6px;border-radius:12px;border:1px solid var(--rule);background:#fff;font:600 15px var(--body);cursor:pointer}
.seg3 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* splash + login */
#splash{position:fixed;inset:0;z-index:3000;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash .name{font:700 40px/1 var(--disp);letter-spacing:.3px}
#splash .tag{font:400 15px/1.45 var(--body);opacity:.8;text-align:center;max-width:280px}
#splash .kerb{width:150px;height:10px;border-radius:5px;background:repeating-linear-gradient(-45deg,var(--kerb) 0 7px,#0E151C 7px 14px);background-size:200% 100%;animation:kerbmove 1s linear infinite}
@keyframes kerbmove{to{background-position:-40px 0}}
#splash .foot{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));font-size:12px;opacity:.55}
.auth{flex:1;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font:700 26px/1 var(--disp)}
.field{display:flex;flex-direction:column;gap:6px}
.pw{position:relative}
.pw input{padding-right:64px}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--rain);font:600 13px var(--body);cursor:pointer;padding:8px}
.err{background:var(--failW);color:var(--fail);border-radius:10px;padding:10px 12px;font-size:14px}
.err[hidden]{display:none}
.center{text-align:center}
/* new features */
.danger{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#fff;border:1.5px solid var(--fail);text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.danger .bub{background:var(--fail)}
.tile.hz .bub{background:var(--failW)}
.tile.hz.on{border-color:var(--fail)}
.tile.hz.on .tk{background:var(--fail)}
.btn.red{background:var(--fail);border-color:var(--fail)}
#tabs a{position:relative}
#tabs a .dot{position:absolute;top:4px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--fail);border:2px solid #fff}
.newchip{display:inline-flex;align-self:flex-start;padding:2px 8px;border-radius:999px;background:var(--fail);color:#fff;font:700 11px var(--body)}
.health{display:flex;align-items:center;gap:14px}
.ring{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0)}
.ring b{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 20px var(--disp)}
.warn{background:var(--amberW);border:1px solid #EBCF97;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.bad{background:var(--failW);border:1px solid #EDC9C1;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.urgent{background:var(--fail);color:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.urgent .btn{background:#fff;color:var(--fail);border-color:#fff}
.wa{background:#E7F7EE;color:#1B7F45;border-color:#9ED9B6}
.outbox{border:1.5px dashed var(--amber);background:var(--amberW)}
.chips3{display:flex;gap:8px;flex-wrap:wrap}
.chips3 button{padding:9px 12px;border-radius:10px;border:1px solid var(--rule);background:#fff;font:600 14px var(--body);cursor:pointer}
.chips3 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ================= look and feel (visual only) ================= */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
#app{background:linear-gradient(180deg,#E6EEF3 0,var(--paper) 260px)}
/* screens slide in gently */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#screen>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
#screen>*:nth-child(2){animation-delay:.04s}#screen>*:nth-child(3){animation-delay:.08s}#screen>*:nth-child(4){animation-delay:.12s}
#screen>*:nth-child(5){animation-delay:.16s}#screen>*:nth-child(6){animation-delay:.2s}#screen>*:nth-child(n+7){animation-delay:.24s}
/* press feedback */
.card,.tile,.choice,.hero,.danger,.stat,.opt,.btn,.voice,.chipbtn,.photo-pick{transition:transform .12s ease,box-shadow .2s ease,border-color .2s ease}
a.card:active,.tile:active,.choice:active,.hero:active,.danger:active,.btn:active,.stat:active,.opt:active,.voice:active,.chipbtn:active{transform:scale(.97)}
a.card:hover,.tile:hover,.stat:hover{box-shadow:0 6px 18px rgba(24,35,46,.10)}
/* home hero with a little city skyline */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#18232E 0%,#1F3446 55%,#2A5577 120%)}
.hero>*{position:relative;z-index:1}
.hero .sky{position:absolute;right:-6px;bottom:-4px;width:210px;height:96px;z-index:0;opacity:.16}
.hero::after{content:"";position:absolute;top:-60%;left:-30%;width:40%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);transform:rotate(18deg);animation:shine 4.5s ease-in-out 1s infinite}
@keyframes shine{0%{left:-40%}35%,100%{left:130%}}
.hero .bub{box-shadow:0 0 0 6px rgba(242,194,0,.18)}
/* danger button: soft pulse */
.danger .bub{position:relative}
.danger .bub::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--fail);animation:ping 1.8s ease-out infinite}
@keyframes ping{to{transform:scale(1.7);opacity:0}}
/* tab bar: pill behind the active tab */
#tabs{box-shadow:0 -4px 18px rgba(24,35,46,.06)}
#tabs a>svg,#tabs a>span{position:relative;z-index:1}
#tabs a.on::before{content:"";position:absolute;top:3px;left:50%;width:58px;height:31px;margin-left:-29px;border-radius:999px;background:var(--kerbW);animation:pill .25s ease both}
@keyframes pill{from{transform:scaleX(.4);opacity:0}}
/* progress bars and ring fill up */
.prog i.on{transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.prog i.on:nth-child(2){animation-delay:.08s}.prog i.on:nth-child(3){animation-delay:.16s}.prog i.on:nth-child(4){animation-delay:.24s}.prog i.on:nth-child(5){animation-delay:.32s}
@keyframes grow{from{transform:scaleX(0)}}
.ring{animation:ringfill 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringfill{from{--p:0}}
/* sent: tick pops and draws itself */
.big-ok{position:relative;animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
.big-ok::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--fixed);animation:ping 1s ease-out .2s 2}
.big-ok svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .25s ease forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
/* selected tiles bounce a little */
.tile.on .bub,.opt.on .bub{animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
/* front page */
#splash{background:radial-gradient(circle at 50% 38%,#24394C 0,#18232E 60%)}
#splash>svg{animation:drop .8s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
#splash .name{animation:rise .6s .25s both}
#splash .tag{animation:rise .6s .4s both}
#splash .skyline{position:absolute;left:0;right:0;bottom:0;height:150px;opacity:.12}
@keyframes drop{from{transform:translateY(-40px) scale(.7);opacity:0}}
/* login / sign-up header band */
.auth>.authband:first-child{margin-top:-18px}
.authband>*{position:relative;z-index:1}
.authband>.sky{position:absolute;z-index:0}
.authband .logo{border-radius:14px;box-shadow:0 0 0 2px rgba(255,255,255,.22)}
.authband{margin:0 -20px 4px;padding:30px 22px 22px;background:linear-gradient(135deg,#18232E 0%,#1F3446 60%,#2A5577 130%);color:#fff;position:relative;overflow:hidden;border-radius:0 0 26px 26px}
.authband .brand b{color:#fff}
.authband .sky{position:absolute;right:-10px;bottom:-6px;width:240px;height:100px;opacity:.16}
.authband .kerb{margin-top:14px}
.authband .tagline{opacity:.8;font-size:14px;margin-top:10px;position:relative}
/* engineer numbers */
.stat b,.fact b{font-variant-numeric:tabular-nums}
/* rain alert */
.rain{border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;color:#fff;background:linear-gradient(135deg,#1F4E79 0%,#2F6F9F 100%);position:relative;overflow:hidden}
.rain .bub{background:rgba(255,255,255,.18)}
.rain::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 14px,rgba(255,255,255,.07) 14px 15px);animation:drizzle 1.2s linear infinite}
@keyframes drizzle{to{background-position:0 30px}}
.rain>*{position:relative}
a.rain,a.rain:visited{color:#fff;text-decoration:none}
.rain.dry{background:#fff;color:inherit;border:1px solid var(--soft);box-shadow:var(--shadow)}
.rain.dry::before{display:none}
.rain.dry .bub{background:var(--rainW)}
/* before / after slider */
.cmp{position:relative;height:230px;border-radius:16px;overflow:hidden;background:#C9D3DA;--x:50%}
.cmp-img{position:absolute;inset:0;background:center/cover no-repeat}
.cmp-before{clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.cmp-line{position:absolute;top:0;bottom:0;left:var(--x);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.35);pointer-events:none}
.cmp-line span{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.cmp-tag{position:absolute;top:10px;padding:3px 8px;border-radius:6px;background:rgba(24,35,46,.75);color:#fff;font:600 12px var(--body);pointer-events:none}
.cmp-tag.l{left:10px}.cmp-tag.r{right:10px}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
/* impact badge */
.impact{background:linear-gradient(135deg,#FFF9E3 0%,#FFFFFF 70%);border-color:#F3E2A0}
.medal{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--kerb);box-shadow:0 0 0 5px rgba(242,194,0,.2);animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

async function api(path, body) {
  const headers = {};
  if (TOKEN) headers["X-Token"] = TOKEN;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const opt = body === undefined ? { headers } : { method: "POST", headers, body: JSON.stringify(body) };
  let r;
  try { r = await fetch(path, opt); } catch (e) { throw new Error(t("net_err")); }
  if (!r.ok) {
    let msg = "Error " + r.status;
    try { const j = await r.json(); if (j.detail) msg = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch (e) {}
    const err = new Error(msg); err.status = r.status;
    throw err;
  }
  return r.json();
}

// ----- the real area name for a GPS position (OpenStreetMap, needs internet on the phone) -----
async function areaName(lat, lng) {
  const key = `${lat.toFixed(3)},${lng.toFixed(3)},${LANG}`;
  const cache = store.get("areas", {});
  if (cache[key]) return cache[key];
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&addressdetails=1&accept-language=${LANG === "en" ? "en" : LANG + ",en"}&lat=${lat}&lon=${lng}`;
    const r = await fetch(url);
    if (!r.ok) return null;
    const a = (await r.json()).address || {};
    const local = a.suburb || a.neighbourhood || a.quarter || a.residential || a.city_district || a.village || a.town || a.road;
    const city = a.city || a.town || a.state_district || "";
    const name = [...new Set([local, city].filter(Boolean))].join(", ");
    if (!name) return null;
    cache[key] = name; store.set("areas", cache);
    return name;
  } catch (e) { return null; }
}

  if (store.get("rain_demo", false)) return { mm: [2.4, 34.6, 18.2], prob: [40, 90, 80], demo: true };
  if (rainCache && Date.now() - rainCache.at < (rainCache.data ? 30 : 5) * 60 * 1000) return rainCache.data;   // offline: retry in 5 min
  try {
    const m = await meta();
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${m.center[0]}&longitude=${m.center[1]}&daily=precipitation_sum,precipitation_probability_max&timezone=Asia%2FKolkata&forecast_days=3`;
    const r = await fetch(url);
    if (!r.ok) return null;
    const j = await r.json();
    const data = { mm: j.daily.precipitation_sum.map((x) => Math.round((x || 0) * 10) / 10),
      prob: (j.daily.precipitation_probability_max || []).map((x) => x || 0), demo: false };
    rainCache = { at: Date.now(), data };
    return data;
  } catch (e) { rainCache = { at: Date.now(), data: null }; return null; }
}

function getLocation() {
  return new Promise((resolve, reject) => {
    const done = () => { clearTimeout(timer); window.cmOnLocation = null; window.cmOnLocationError = null; };
    const timer = setTimeout(() => { done(); reject(new Error(t("gps_slow"))); }, 25000);
    window.cmOnLocation = (lat, lng, acc) => { done(); resolve({ lat: +lat, lng: +lng, acc: +acc || 0 }); };
    window.cmOnLocationError = (msg) => { done(); reject(new Error(msg || t("gps_fail"))); };
    if (native && native.requestLocation) { native.requestLocation(); return; }
    if (!navigator.geolocation) { done(); reject(new Error(t("gps_fail"))); return; }
    navigator.geolocation.getCurrentPosition(
      (p) => window.cmOnLocation && window.cmOnLocation(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
      () => window.cmOnLocationError && window.cmOnLocationError(t("gps_fail")),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
  });
}

// ---------- voice ----------
function startVoice(tag, onText, onEnd) {
  window.cmOnVoice = (txt) => { window.cmOnVoice = null; onEnd(); if (txt) onText(String(txt)); };
  window.cmOnVoiceError = (msg) => { window.cmOnVoiceError = null; onEnd(); toast(msg || t("voice_none")); };
  if (native && native.startVoice) { native.startVoice(tag); return true; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { onEnd(); toast(t("voice_none")); return false; }
  const r = new SR();
  r.lang = tag; r.interimResults = false; r.maxAlternatives = 1;
  r.onresult = (e) => window.cmOnVoice && window.cmOnVoice(e.results[0][0].transcript);
  r.onerror = () => window.cmOnVoiceError && window.cmOnVoiceError(t("voice_none"));
  r.onend = () => { if (window.cmOnVoice) { window.cmOnVoice = null; onEnd(); } };
  try { r.start(); } catch (e) { onEnd(); toast(t("voice_none")); return false; }
  return true;
}

// ---------- photos (shrunk on the phone before sending) ----------
function readPhoto(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, (max || 1280) / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(t("photo_bad"))); };
    img.src = url;
  });
}
function bindPhoto(input, onPhoto) {
  input.addEventListener("change", async () => {
    const f = input.files && input.files[0];
    if (!f) return;
    try { onPhoto(await readPhoto(f)); } catch (e) { toast(e.message); }
    input.value = "";
  });
}

// ---------- navigation (hash routes, with a simple back stack) ----------
const stack = [];
let token = 0;
let map = null;
function goBack(fallback) { if (stack.length > 1) history.back(); else location.replace(fallback); }
function onHash() {
  const h = location.hash;
  if (stack.length > 1 && stack[stack.length - 2] === h) stack.pop();
  else if (stack[stack.length - 1] !== h) stack.push(h);
  render();
}
const ROUTES = [
  [/^#\/lang$/, scrLang], [/^#\/role$/, scrRole], [/^#\/login$/, scrLogin], [/^#\/register$/, scrRegister],
  [/^#\/home$/, scrHome], [/^#\/report$/, scrPick], [/^#\/details$/, scrDetails], [/^#\/sent\/([\w-]+)$/, scrSent],
  [/^#\/nearby$/, scrNearby], [/^#\/mine$/, scrMine], [/^#\/fixed\/([\w-]+)$/, scrFixed], [/^#\/me$/, scrMe],
  [/^#\/danger$/, scrDanger], [/^#\/e\/monsoon$/, eMonsoon],
  [/^#\/e\/today$/, eToday], [/^#\/e\/map$/, eMap], [/^#\/e\/review$/, eReview],
  [/^#\/e\/asset\/([\w-]+)$/, eAsset], [/^#\/e\/repair\/([\w-]+)$/, eRepair],
];
async function render() {
  if (map) { map.remove(); map = null; }
  closeSheet();
  const h = location.hash;
  if (!LANG && h !== "#/lang") return location.replace("#/lang");
  if (LANG && !TOKEN && !["#/lang", "#/login", "#/register"].includes(h)) return location.replace("#/login");
  if (LANG && TOKEN && !ROLE && h !== "#/lang" && h !== "#/role") return location.replace("#/role");
  if (!META) { try { await meta(); } catch (e) { /* the screen will show the connection error */ } }
  for (const [re, fn] of ROUTES) {
    const m = h.match(re);
    if (m) {
      const my = ++token;
      try { await fn(my, ...m.slice(1)); } catch (e) { if (my === token) { setTabs(null); showError(e); } }
      return;
    }
  }
  location.replace(home());
}

let UNSEEN = 0;
const seenKey = (v) => `${v.step}|${v.updated}|${v.safe_on || ""}|${v.feedback ? (v.feedback.fixed ? 1 : 0) : ""}`;
function trackNew(rows) {
  const s = store.get("seen", {}); let n = 0, changed = false;
  rows.forEach((v) => {
    const k = seenKey(v);
    if (s[v.id] === undefined) { s[v.id] = k; changed = true; } else if (s[v.id] !== k) n++;
  });
  if (changed) store.set("seen", s);
  UNSEEN = n;
  return s;
}

// ----- send later: complaints made with no internet wait on the phone -----
const outbox = () => store.get("outbox", []);
let flushing = false;
async function flushOutbox() {
  const box = outbox();
  if (!box.length || flushing) return 0;
  flushing = true;
  let sent = 0; const left = [];
  for (const item of box) {
    try { const r = await api("/api/complaints", item.body); addMine(r.complaint.id); sent++; }
    catch (e) { if (!e.status) left.push(item); }   // still offline: keep it; rejected by server: drop it
  }
  store.set("outbox", left); flushing = false;
  if (sent) toast(t("sent_later"));
  return sent;
}
window.addEventListener("online", () => flushOutbox().then((n) => { if (n) render(); }));
async function sendComplaint(body) {
  try { const r = await api("/api/complaints", body); addMine(r.complaint.id); lastSent = r; return r; }
  catch (e) {
    if (e.status) throw e;
    const b = outbox(); b.push({ body, at: Date.now() }); store.set("outbox", b);
    toast(t("saved_offline")); location.replace("#/mine");
    return null;
  }
}

const aiCache = {};
let histAll = false;
function timelineSvg(comps, reps, an, today) {
  const dates = comps.map((c) => c.date).concat(reps.map((r) => r.date));
  if (!dates.length) return "";
  const pred = an.prediction && an.prediction.date;
  const y0 = Math.min(...dates.map((d) => +d.slice(0, 4)));
  const y1 = Math.max(...dates.map((d) => +d.slice(0, 4)), pred ? +pred.slice(0, 4) : 0, +today.slice(0, 4));
  const W = 340, H = 92, L0 = 6, R0 = W - 6;
  const T0 = Date.UTC(y0, 0, 1), T1 = Date.UTC(y1 + 1, 0, 1);
  const X = (iso) => L0 + ((Date.parse(iso + "T00:00:00Z") - T0) / (T1 - T0)) * (R0 - L0);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t("e_tl"))}">`;
  for (let y = y0; y <= y1; y++) {
    const a = X(`${y}-05-15`), b = X(`${y}-10-31`);
    s += `<rect x="${a}" y="8" width="${b - a}" height="58" fill="#CFE1EF"/>`;
    s += `<text x="${X(`${y}-01-01`) + 2}" y="${H - 6}" font-size="10" fill="#5B6B78">${y}</text>`;
    s += `<line x1="${X(`${y}-01-01`)}" y1="8" x2="${X(`${y}-01-01`)}" y2="70" stroke="#D3DCE1"/>`;
  }
  s += `<line x1="${X(today)}" y1="4" x2="${X(today)}" y2="70" stroke="#18232E" stroke-dasharray="3 3"/>`;
  comps.forEach((c) => (s += `<circle cx="${X(c.date)}" cy="26" r="4.2" fill="#C2412D" stroke="#fff" stroke-width="1"/>`));
  reps.forEach((r) => (s += `<rect x="${X(r.date) - 3.5}" y="44" width="7" height="${r.kind === "permanent" ? 14 : 9}" fill="${r.kind === "permanent" ? "#2E7D5B" : "#18232E"}"/>`));
  if (pred && !an.fixed_on) s += `<circle cx="${X(pred)}" cy="26" r="6" fill="none" stroke="#B7791F" stroke-width="2" stroke-dasharray="2 2"/>`;
  return s + "</svg>";
}

  const sug = aiCache[id];
  const canApprove = !pr.band.startsWith("Fixed") && !pr.band.startsWith("Permanent fix planned");
  const hist = d.complaints.map((c) => ({ k: "c", date: c.date, x: c })).concat(d.repairs.map((r) => ({ k: "r", date: r.date, x: r })))
    .sort((p, q) => (p.date < q.date ? 1 : p.date > q.date ? -1 : p.k === "r" ? -1 : 1));
  const lasted = {}; an.repairs_detail.forEach((x) => (lasted[x.repair_id] = x));
  const shown = histAll ? hist : hist.slice(0, 6);
  paint(`
    ${backLink("#/e/today", t("tab_today"))}
    <div class="col" style="gap:6px"><div class="row between"><h1>${esc(a.id)}</h1>${badge(sum)}</div>
      <b>${esc(a.name)}</b><span class="small muted">${esc(d.department)} · ${esc(t("e_away", { d: dist(away) }))}</span></div>
    <div class="facts">
      <div class="fact"><b>${an.failures}</b><span>${esc(t("e_failures"))}</span></div>
      <div class="fact"><b>${esc(rs(an.total_cost))}</b><span>${esc(t("e_spent"))}</span></div>
      <div class="fact"><b>${an.shortest_lasted_days != null ? esc(t("e_days", { n: an.shortest_lasted_days })) : "—"}</b><span>${esc(t("e_lasted"))}</span></div>
      <div class="fact"><b>${esc(nextTxt)}</b><span>${esc(t("e_next"))}</span></div>
    </div>
    <div class="card">${timelineSvg(d.complaints, d.repairs, an, m.today)}<span class="small muted">${esc(t("e_tl"))}</span>
      <span class="small ink2">${esc(an.prediction.label)}</span></div>
    ${fb.length ? `<div class="tip">${icon("chat", 20, "#8A6A00")}<p class="small">${esc(t("e_feedback", { y: yes, n: no }))}</p></div>` : ""}
    ${works.map((w) => `<div class="warn">${icon("alert", 22, "#B7791F")}<div class="col"><b>${esc(t("d_title"))}</b>
      <span class="small ink2">${esc(t("d_body", { a: w.agency, w: w.what.toLowerCase(), p: w.place, s: fmtDate(w.start, { day: "numeric", month: "short", year: "numeric" }), e: fmtDate(w.end, { day: "numeric", month: "short", year: "numeric" }) }))}</span></div></div>`).join("")}
    <div class="card"><p class="h3 row" style="gap:8px">${icon("shield", 18, "#2E7D5B")}${esc(t("w_title"))}</p>
      ${wa.active ? `<b style="color:var(--fixed)">${esc(t("w_active", { n: wa.active.warranty_days_left }))}</b>
        <span class="small muted">${esc(t("w_by", { c: wa.active.contractor, k: wa.active.kind === "permanent" ? t("r_perm").toLowerCase() : t("r_patch").toLowerCase(), d: fmtDate(wa.active.warranty_until, { day: "numeric", month: "short", year: "numeric" }) }))}</span>`
        : `<span class="small muted">${esc(t("w_none"))}</span>`}
      ${wa.failed_in_warranty ? `<div class="bad"><b class="small">${esc(t("w_failed", { n: wa.failed_in_warranty, x: rs(wa.recoverable), c: wa.contractors.join(", ") }))}</b></div>` : ""}
    </div>
    ${mo ? `<div class="card"><p class="h3 row" style="gap:8px">${icon("info", 18, "#2F6F9F")}${esc(t("m_title"))}</p>
      <span class="small ink2">${esc(t("m_patch", { x: rs(mo.patch_per_year) }))}</span>
      <span class="small ink2">${esc(t("m_perm", { x: rs(mo.permanent_cost) }))} ${mo.permanent_is_estimate ? esc(t("m_est")) : ""}</span>
      ${mo.saved_so_far != null ? `<b style="color:var(--fixed)">${esc(t("m_saved", { x: rs(mo.saved_so_far) }))}</b>`
        : `<span class="small ink2">${esc(t("m_payback", { y: mo.payback_years }))}</span>${mo.ten_year_saving > 0 ? `<b style="color:var(--fixed)">${esc(t("m_ten", { x: rs(mo.ten_year_saving) }))}</b>` : ""}`}
    </div>` : ""}
    <div class="card ai" id="ai">
      ${sug ? `<div class="row" style="gap:8px">${icon("spark", 18, "#2F6F9F")}<span class="small muted">${esc(t("e_conf", { src: sug.source, c: sug.confidence_label }))}</span></div>
          <p><b>${esc(t("e_cause"))}.</b> ${esc(sug.cause)}</p><p><b>${esc(t("e_fix"))}.</b> ${esc(sug.fix)}</p>
          ${sug.evidence && sug.evidence.length ? `<span class="small muted">${esc(t("e_based"))}</span><div class="chips">${sug.evidence.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>` : ""}
          <span class="small muted">${esc(t("e_ai_note"))}</span>`
        : `<button class="btn light" id="ask">${icon("spark", 20, "#2F6F9F")}${esc(t("e_ask"))}</button>`}
    </div>
    ${canApprove ? `<button class="btn" id="approve">${icon("shield", 20, "#fff")}${esc(t("e_approve"))}</button>` : ""}
    <a class="btn ${canApprove ? "light" : ""}" href="#/e/repair/${esc(a.id)}">${icon("wrench", 20)}${esc(t("e_log"))}</a>
    <div class="card" style="padding:6px 16px"><p class="h3" style="padding-top:8px">${esc(t("e_history"))}</p>
      ${shown.map((h) => h.k === "c"
        ? `<div class="hist"><span class="mk" style="background:#C2412D"></span><div class="col grow"><span class="small muted">${esc(fmtDate(h.date, { day: "numeric", month: "short", year: "numeric" }))} · ${esc(h.x.id)} · ${esc(h.x.channel)}</span><span class="small">“${esc(h.x.text)}”</span>${h.x.photo ? `<div class="thumbs"><img src="${esc(h.x.photo)}" alt=""></div>` : ""}${h.x.feedback ? `<span class="small" style="color:${h.x.feedback.fixed ? "var(--fixed)" : "var(--fail)"}">${esc(h.x.feedback.fixed ? "Citizen: fixed" : "Citizen: still a problem")}</span>` : ""}</div></div>`
        : `<div class="hist"><span class="mk" style="background:${h.x.kind === "permanent" ? "#2E7D5B" : "#18232E"};border-radius:2px"></span><div class="col grow"><span class="small muted">${esc(fmtDate(h.date, { day: "numeric", month: "short", year: "numeric" }))} · ${esc(h.x.id)} · ${esc(rs(h.x.cost))}</span><span class="small">${esc(h.x.note)}</span>
            <span class="small muted">${esc(h.x.contractor || "")}${h.x.warranty_months ? " · " + esc(t("r_months", { n: h.x.warranty_months })) : ""}</span>
            ${lasted[h.x.id] && lasted[h.x.id].failed_in_warranty ? `<span class="badge b-red">${esc(t("w_in"))}</span>` : ""}
            ${lasted[h.x.id] ? `<span class="small ${lasted[h.x.id].lasted_days != null && lasted[h.x.id].lasted_days <= 90 ? "" : "muted"}" style="${lasted[h.x.id].lasted_days != null && lasted[h.x.id].lasted_days <= 90 ? "color:var(--fail);font-weight:600" : ""}">${esc(lasted[h.x.id].lasted_days != null ? t("e_lasted_n", { n: lasted[h.x.id].lasted_days }) : lasted[h.x.id].still_holding_days ? t("e_holding", { n: lasted[h.x.id].still_holding_days }) : t("e_done_today"))}</span>` : ""}
            ${h.x.photo_before || h.x.photo_after ? `<div class="thumbs">${h.x.photo_before ? `<img src="${esc(h.x.photo_before)}" alt="">` : ""}${h.x.photo_after ? `<img src="${esc(h.x.photo_after)}" alt="">` : ""}</div>` : ""}</div></div>`).join("")}
      ${hist.length > 6 && !histAll ? `<button class="link" id="more" style="padding:10px 0">${esc(t("e_show_all", { n: hist.length }))}</button>` : ""}
    </div>`);
  const ask = $("#ask");
  if (ask) ask.onclick = async () => {
    ask.disabled = true; ask.textContent = t("e_asking");
    try { aiCache[id] = await api(`/api/assets/${encodeURIComponent(id)}/suggest`, {}); render(); }
    catch (e) { toast(e.message); ask.disabled = false; ask.innerHTML = icon("spark", 20, "#2F6F9F") + esc(t("e_ask")); }
  };
  const ap = $("#approve");
  let warned = false;
  if (ap) ap.onclick = async () => {
    if (works.length && !warned) {   // Don't dig again: make the engineer stop and think once
      warned = true;
      ap.classList.add("red");
      ap.textContent = t("d_confirm", { a: works[0].agency, s: fmtDate(works[0].start, { day: "numeric", month: "short" }) });
      return;
    }
    ap.disabled = true;
    try { await api(`/api/assets/${encodeURIComponent(id)}/decision`, { action: "approve_fix", suggestion: aiCache[id] || null }); toast(t("e_approved")); render(); }
    catch (e) { toast(e.message); ap.disabled = false; }
  };
  const more = $("#more"); if (more) more.onclick = () => { histAll = true; render(); };
}

const repairDraft = {};
async function eRepair(my, id) {
  setTabs("e", 0); loading();
  const d = await api("/api/assets/" + encodeURIComponent(id));
  if (stale(my)) return;
  const a = d.asset;
  const rd = repairDraft[id] || (repairDraft[id] = { kind: d.priority.band.startsWith("High") || d.priority.band.startsWith("Permanent") ? "permanent" : "patch", cost: "", note: "", before: null, after: null, contractor: "", months: null, warned: false });
  const months = rd.months || (rd.kind === "permanent" ? (a.type === "streetlight" ? 12 : 24) : 3);
  const works = d.works_nearby || [];
  const thing = t("th_" + a.type);
  const tilePh = (key, src, label) => `<label class="photo-pick">${src ? `<img src="${src}" alt=""><span class="over">${esc(label)}</span>` : `${icon("camera", 24)}<b class="small">${esc(t("r_add"))}</b><span class="small muted">${esc(label)}</span>`}<input type="file" accept="image/*" data-ph="${key}" aria-label="${esc(label)}"></label>`;
  paint(`
    ${backLink("#/e/asset/" + a.id, a.id)}
    <div class="col"><h1>${esc(t("r_title"))}</h1><span class="muted small">${esc(a.name)}</span></div>
    <div class="col" style="gap:8px"><span class="label">${esc(t("r_what"))}</span>
      <div class="opts" id="kind">
        <button class="opt ${rd.kind === "patch" ? "on" : ""}" data-k="patch"><span class="bub" style="width:38px;height:38px;background:var(--greyW)">${icon("wrench", 18, "#3A4A57")}</span><b>${esc(t("r_patch"))}</b><span class="small muted">${esc(t("r_patch_s"))}</span></button>
        <button class="opt ${rd.kind === "permanent" ? "on" : ""}" data-k="permanent"><span class="bub" style="width:38px;height:38px;background:var(--fixedW)">${icon("shield", 18, "#2E7D5B")}</span><b>${esc(t("r_perm"))}</b><span class="small muted">${esc(t("r_perm_s"))}</span></button>
      </div></div>
    <div class="col" style="gap:8px"><span class="label">${esc(t("r_cost"))}</span>
      <div class="money"><span>₹</span><input id="cost" inputmode="numeric" placeholder="6,20,000" value="${esc(rd.cost)}"></div></div>
    <div class="col" style="gap:8px"><span class="label">${esc(t("r_contractor"))}</span>
      <input type="text" id="ctr" maxlength="60" placeholder="${esc(t("r_contractor_ph"))}" value="${esc(rd.contractor)}"></div>
    <div class="col" style="gap:8px"><span class="label">${esc(t("r_warranty"))}</span>
      <div class="chips3" id="wm">${[3, 6, 12, 24].map((n) => `<button data-m="${n}" class="${n === months ? "on" : ""}">${esc(t("r_months", { n }))}</button>`).join("")}</div></div>
    ${works.length && rd.kind === "permanent" ? `<div class="warn">${icon("alert", 22, "#B7791F")}<div class="col"><b>${esc(t("d_title"))}</b><span class="small ink2">${esc(t("d_body", { a: works[0].agency, w: works[0].what.toLowerCase(), p: works[0].place, s: fmtDate(works[0].start, { day: "numeric", month: "short", year: "numeric" }), e: fmtDate(works[0].end, { day: "numeric", month: "short", year: "numeric" }) }))}</span></div></div>` : ""}
    <div class="col" style="gap:8px"><span class="label">${esc(t("r_photos"))}</span>
      <div class="photos2">${tilePh("before", rd.before, t("r_before"))}${tilePh("after", rd.after, t("r_after"))}</div></div>
    <div class="col" style="gap:8px"><span class="label">${esc(t("r_notes"))}</span>
      <textarea id="note" maxlength="300" placeholder="${esc(t("r_notes_ph"))}">${esc(rd.note)}</textarea></div>
    <button class="btn" id="save">${icon("check", 20, "#fff", 2.5)}${esc(t("r_save"))}</button>
    <p class="small muted" style="text-align:center">${esc(t("r_watch", { thing }))}</p>`);
  const cost = $("#cost"), note = $("#note"), ctr = $("#ctr");
  const keep = () => { rd.cost = cost.value; rd.note = note.value; rd.contractor = ctr.value; };
  ctr.oninput = keep;
  $("#wm").onclick = (e) => { const b = e.target.closest("[data-m]"); if (!b) return; keep(); rd.months = +b.dataset.m; render(); };
  cost.oninput = () => { const n = cost.value.replace(/[^\d]/g, ""); cost.value = n ? Number(n).toLocaleString("en-IN") : ""; keep(); };
  note.oninput = keep;
  $("#kind").onclick = (e) => { const b = e.target.closest("[data-k]"); if (!b) return; keep(); rd.kind = b.dataset.k; rd.months = null; rd.warned = false; render(); };
  $$("[data-ph]").forEach((inp) => bindPhoto(inp, (data) => { keep(); rd[inp.dataset.ph] = data; render(); }));
  $("#save").onclick = async () => {
    keep();
    const n = Number(String(rd.cost).replace(/[^\d]/g, ""));
    if (!n) { toast(t("r_need_cost")); cost.focus(); return; }
    const b = $("#save");
    if (rd.kind === "permanent" && works.length && !rd.warned) {
      rd.warned = true; b.classList.add("red");
      b.textContent = t("d_confirm", { a: works[0].agency, s: fmtDate(works[0].start, { day: "numeric", month: "short" }) });
      return;
    }
    b.disabled = true;
    try {
      await api(`/api/assets/${encodeURIComponent(id)}/repairs`, { kind: rd.kind, cost: n, note: rd.note, photo_before: rd.before, photo_after: rd.after,
        contractor: rd.contractor, warranty_months: months });
      delete repairDraft[id];
      toast(t("r_saved"));
      location.replace("#/e/asset/" + id);
    } catch (e) { toast(e.message); b.disabled = false; }
  };
}

// ---------- start ----------
document.documentElement.lang = LANG || "en";
window.addEventListener("hashchange", onHash);
(async () => {
  // front page: logo for a moment while we check the saved login with the server
  const started = Date.now();
  if (TOKEN) {
    try { USER = await api("/api/me"); store.set("user", USER); }
    catch (e) { if (e.status === 401) { TOKEN = null; store.set("token", null); } }
  }
  if (!location.hash) history.replaceState(null, "", !LANG ? "#/lang" : !TOKEN ? "#/login" : !ROLE ? "#/role" : home());
  onHash();
  setTimeout(() => $("#splash").classList.add("hide"), Math.max(0, 1400 - (Date.now() - started)));
})();
</script>
